[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "farsight-dashboard"
version = "0.2.0"
description = "Agentless web dashboard for Dynamo / SGLang inference clusters: nodes, GPUs, services, topology and cost, over SSH"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
keywords = ["dashboard", "monitoring", "gpu", "llm", "inference", "ssh", "dynamo", "sglang"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/KellyGong/FarSight"
Issues = "https://github.com/KellyGong/FarSight/issues"

[project.scripts]
farsight = "farsight.cli:main"

[tool.setuptools]
packages = ["farsight"]

[tool.setuptools.package-data]
farsight = ["static/*", "static/js/*", "static/js/views/*"]
